name: Publish site

# Corre manualmente desde la pestaña Actions, o automático al pushear a main.
# Ajustar 'on' según tu flujo (por ejemplo, agregar un cron semanal).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vertical-engine (privado)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el pipeline de publicación
        run: python publish.py

      - name: Checkout vertlabs-site (público)
        uses: actions/checkout@v4
        with:
          repository: TU_USUARIO/vertlabs-site
          ssh-key: ${{ secrets.VERTLABS_SITE_DEPLOY_KEY }}
          path: vertlabs-site

      - name: Sincronizar output/ al repo público
        run: |
          rsync -av --delete output/ vertlabs-site/

      - name: Commit y push al repo público
        working-directory: vertlabs-site
        run: |
          git config user.name "vertlabs-bot"
          git config user.email "bot@vertlabs.run"
          git add -A
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Publish: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
