<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vertical Trail Labs{% endblock %}</title>
  <meta name="description" content="{% block description %}Análisis de rendimiento en trail running: VPI, DMI y ER.{% endblock %}">
  <link rel="canonical" href="{% block canonical %}https://vertlabs.run/{% endblock %}">

  <!-- OpenGraph -->
  <meta property="og:title" content="{% block og_title %}Vertical Trail Labs{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Análisis de rendimiento en trail running.{% endblock %}">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">Vertical Trail Labs</a>
    <nav>
      <a href="/races/">Carreras</a>
      <a href="/athletes/">Atletas</a>
      <a href="/rankings/">Rankings</a>
      <a href="/about/">Sobre el Engine</a>
      <a href="/search/">Buscar</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ current_year }} Vertical Trail Labs — VPI · DMI · ER</p>
  </footer>

  <script src="/assets/js/search.js" defer></script>
</body>
</html>
